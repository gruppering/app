services:
  app:
    image: gruppering/app
    container_name: gruppering-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7047:8080"
    build:
      context: .
      no_cache: true
      dockerfile: app/Dockerfile
    depends_on:
      postgres:
          condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-gruppering}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Insecure}
      - POSTGRES_USER=${DB_USER:-grouper}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "--username", "grouper" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s