
name: Build Docker Image

on:
  workflow_run:
    workflows: ["Build & Test"]
    types:
      - completed
jobs:
  build-svc:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/gruppering
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gruppering/mvc:latest
            ghcr.io/gruppering/mvc:${{ job.workflow_sha }}
