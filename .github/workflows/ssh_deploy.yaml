name: Deploy to Remote Server
on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types:
      - completed

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote Server
        uses: D3rHase/ssh-command-action@latest
        with:
          host: ${{ secrets.GRUPPERING_NO_SSH_HOST }}
          user: ${{ secrets.GRUPPERING_NO_SSH_USER }}
          private_key: ${{ secrets.GRUPPERING_NO_SSH_SECRET_KEY }}
          command: |
            cd gruppering/mvc
            docker compose pull
            docker compose up -d


