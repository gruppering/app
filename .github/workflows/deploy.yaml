name: Deploy
  
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Publish Image
        uses: matootie/github-docker@v3.1.0
        with:
          context: .
          accessToken: ${{ github.token }}
          tag: |
            latest
            arm64
